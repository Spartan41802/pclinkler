<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PC Stream</title>
<style>
  html, body {
    margin: 0;
    background: #111;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
  }
  #video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: black;
    cursor: none;
  }
  #status {
    position: fixed;
    top: 8px;
    left: 8px;
    color: #0f0;
    font-size: 13px;
    background: rgba(0,0,0,0.5);
    padding: 4px 8px;
    border-radius: 4px;
    z-index: 10;
  }
  #connectBar {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: white;
  }
  input, button {
    padding: 8px 12px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="connectBar">
  <h2>Connect to your PC</h2>
  <input id="hostInput" placeholder="ws://192.168.1.100:8765" style="width:280px" />
  <button id="connectBtn">Connect</button>
</div>

<div id="status" style="display:none">Connecting…</div>
<video id="video" autoplay playsinline controls="false" style="display:none"></video>

<script src="client.js"></script>
</body>
</html>
